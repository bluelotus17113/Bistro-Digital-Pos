<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#12352b">
  <title>Bistro Digital POS</title>
  <link rel="preload" href="/fonts/bricolage-grotesque-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="shell">
    <nav class="rail" aria-label="Secciones">
      <a class="brand" href="#/salon" id="brand">Bistro</a>
      <a class="rail-link" href="#/salon" data-nav="salon">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="9" r="6"/><path d="M12 15v6M8 21h8"/></svg>
        <span>Salón</span>
      </a>
      <a class="rail-link" href="#/ventas" data-nav="ventas">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>
        <span>Ventas</span>
      </a>
      <a class="rail-link" href="#/menu" data-nav="menu">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5z"/><path d="M9 9h6M9 13h6M9 17h3"/></svg>
        <span>Menú</span>
      </a>
      <a class="rail-link" href="#/ajustes" data-nav="ajustes">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
        <span>Ajustes</span>
      </a>
    </nav>
    <main id="view" class="view" tabindex="-1"></main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
